<!DOCTYPE html>
<!--
  MEMONS — gallery.html   (The Gallery)

    gallery.html              가장 최근 전시
    gallery.html#c=<key>      그 캠페인의 전시

  캠페인에서 뽑힌 작품을 모아 봅니다. 데이터는 전부 캠페인 쪽
  것을 그대로 씁니다 -- contest_feed(전시 목록과 기간),
  contest_one(배너·제목), contest_public_winners(작품·핸들·원본
  글). 갤러리 전용 표는 없습니다. 캠페인에서 수상자를 고치면
  여기도 같이 바뀌어야 하기 때문입니다.

  거는 작품은 카드로 만든 등급만입니다(tier_defs 의 card). 참여상
  수백 명까지 걸면 '선정작' 이라는 말이 뜻을 잃습니다.

  주소에 ? 가 아니라 # 를 쓰는 이유는 event.html 과 같습니다 —
  vercel 의 cleanUrls 가 ? 뒤를 떨어뜨립니다.

  필요: step94~104 · contest_feed · contest_one · contest_public_winners
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMONS &mdash; The Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>

  :root{
    --bg:#070707; --panel:#101010; --panel2:#161616; --panel3:#1c1c1c;
    --gold:#E9B84A; --gold-a:#f4d27a; --gold-b:#b8862e;
    --cta-a:#f0d089; --cta-b:#d9ab4d;
    --line:rgba(233,184,74,.22); --hair:rgba(255,255,255,.07);
    --text:#f2efe9; --muted:#8d8a82; --faint:#605d57;
    --green:#4ad07f; --red:#e0556a;
    --c-mythic:#b9a7ff; --c-legendary:#E9B84A; --c-epic:#c468d8;
    --display:'Outfit',var(--font-head,var(--font-body)),-apple-system,sans-serif;
  }
  /* 표제는 전부 이 한 줄을 거칩니다. 폰트를 바꿀 일이 생기면
     --display 하나만 고치면 됩니다. */
  h1,h2,h3,h4,.tag2,.crew b,.facts .pool,.stat .n,.yours .rk,td.rk,.cta{
    font-family:var(--display);letter-spacing:-.02em}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button,input{font-family:inherit}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ===== header =====
     수치는 marketplace.html · collection.html 과 한 글자도 다르지 않게
     맞춰 둔 것입니다. 여기만 고치면 메뉴 위치가 다시 어긋납니다. */
  .head{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:14px 36px;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{height:44px;width:auto;display:block}
  .nav{display:flex;gap:34px;font-size:13px;letter-spacing:1.4px;color:#cdcabf;font-weight:600}
  .nav a{position:relative;padding:6px 0;transition:color .2s}
  .nav a:hover{color:#fff}
  .nav a.on{color:var(--gold)}
  .nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-20px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .hr{display:flex;align-items:center;gap:20px}
  .soc{display:flex;gap:16px;color:#b7b4ac}
  .soc a{display:grid;place-items:center;transition:color .2s}
  .soc a:hover{color:var(--gold)}
  .soc svg{width:18px;height:18px;fill:currentColor}
  .wbtn{border:1px solid var(--gold);color:var(--gold);background:transparent;
    padding:10px 16px;border-radius:8px;font-weight:600;
    font-size:12px;letter-spacing:1.4px;cursor:pointer;transition:.2s;white-space:nowrap;
    display:flex;align-items:center;gap:8px}
  .wbtn:hover{background:var(--gold);color:#000}
  .wbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
  @media(max-width:1040px){.nav,.soc{display:none}}

  .wrap{max-width:1240px;margin:0 auto;padding:60px 34px 110px}


  /* ===== type ===== */
  .eyebrow{font-size:11px;letter-spacing:3.2px;color:var(--muted);font-weight:600;
    text-transform:uppercase}
  h1{font-size:clamp(40px,5.4vw,74px);font-weight:700;line-height:.98;letter-spacing:-.035em;margin:16px 0 10px;text-wrap:balance}
  .tag2{font-size:clamp(20px,2.3vw,31px);font-weight:600;letter-spacing:-.025em;color:var(--text);margin-bottom:14px}
  .lede{font-size:15px;color:var(--muted);line-height:1.7}
  .headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    flex-wrap:wrap;margin-bottom:42px}
  .sidenote{font-size:10.5px;letter-spacing:2.6px;color:var(--faint);
    text-transform:uppercase;padding-bottom:6px;white-space:nowrap}


  .empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14.5px}
  .spin{width:22px;height:22px;margin:70px auto;border-radius:50%;
    border:2px solid rgba(233,184,74,.2);border-top-color:var(--gold);
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  footer.site{border-top:1px solid var(--hair);padding:26px 34px;display:flex;
    align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-size:12.5px;color:var(--faint)}
  footer.site img{height:26px;opacity:.75}
  footer.site a{color:var(--muted)}
  footer.site a:hover{color:var(--gold)}


  /* ===== gallery ===== */
  .gtop{display:flex;align-items:flex-end;justify-content:space-between;
    gap:26px;flex-wrap:wrap;margin-bottom:30px}
  .gtop h1{margin:12px 0 0}
  .selx{min-width:230px}
  .selx label{display:block;font-size:10.5px;letter-spacing:2.6px;color:var(--faint);
    font-weight:600;text-transform:uppercase;margin-bottom:9px}
  .selx .box{position:relative}
  .selx select{appearance:none;-webkit-appearance:none;width:100%;
    background:var(--panel2);border:1px solid var(--hair);border-radius:10px;
    padding:12px 38px 12px 15px;color:var(--text);font:inherit;font-size:13.5px;
    cursor:pointer;outline:0}
  .selx select:hover{border-color:var(--line)}
  .selx .box::after{content:"";position:absolute;right:15px;top:50%;
    width:7px;height:7px;border-right:1.6px solid var(--muted);
    border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);
    pointer-events:none}

  /* 배너. 시안처럼 그림 위에 제목이 얹힙니다 -- 그림이 없는
     캠페인도 있어서, 없으면 글자만 남고 칸은 무너지지 않습니다. */
  .ghero{position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--hair);background:var(--panel2);
    aspect-ratio:1100/240;display:flex;align-items:center;margin-bottom:46px}
  .ghero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ghero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.72) 38%,rgba(0,0,0,.08) 72%)}
  .ghero .in{position:relative;z-index:1;padding:0 clamp(22px,4vw,48px);max-width:720px}
  .ghero h2{font-size:clamp(23px,3.6vw,46px);font-weight:700;letter-spacing:-.02em;
    line-height:1.05;text-wrap:balance}
  .ghero .sub{margin-top:11px;font-size:clamp(10px,1.1vw,12px);letter-spacing:2.6px;
    color:var(--gold);font-weight:600;text-transform:uppercase}
  /* 좁은 화면에서는 비율을 고정하지 않습니다. 고정하면 글자는
     위쪽에만 있는데 아래가 한참 비어 보입니다. */
  @media(max-width:640px){
    .ghero{aspect-ratio:auto;min-height:150px;padding-block:30px}
    .ghero::after{background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.88))}
    .ghero .sub{letter-spacing:1.8px}}

  .swhead{display:flex;align-items:center;gap:20px;margin-bottom:24px}
  .swhead .t{font-size:11px;letter-spacing:3.2px;color:var(--text);
    font-weight:600;text-transform:uppercase;white-space:nowrap}
  .swhead .rule{flex:1;height:1px;background:var(--hair)}
  .swhead .n{font-size:10.5px;letter-spacing:2.4px;color:var(--gold);
    font-weight:600;white-space:nowrap}

  /* 2 / 3 / 4 열. 한 번에 24점씩 붙이므로 어느 폭에서도 마지막
     줄이 비지 않습니다. */
  .ggrid{display:grid;gap:22px;grid-template-columns:repeat(4,1fr)}
  @media(max-width:1100px){.ggrid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:700px){.ggrid{grid-template-columns:repeat(2,1fr);gap:14px}}

  .w{display:block;cursor:pointer}
  .w .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--panel2);
    border:1px solid var(--hair);transition:border-color .2s,transform .2s}
  .w .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .w:hover .ph{border-color:var(--line);transform:translateY(-3px)}
  .w .hn{margin-top:11px;font-size:13px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w .tr{margin-top:3px;font-size:9.5px;letter-spacing:2.2px;font-weight:600;
    text-transform:uppercase;color:var(--muted)}

  .moreRow{display:flex;justify-content:center;margin-top:48px}
  .moreBtn{background:none;border:1px solid var(--line);color:var(--text);
    border-radius:999px;padding:13px 34px;font-size:12px;letter-spacing:2.4px;
    font-weight:600;cursor:pointer;transition:.2s}
  .moreBtn:hover{border-color:var(--gold);color:var(--gold)}
  .moreBtn[disabled]{opacity:.4;cursor:default}

  /* 크게 보기. 격자에서는 정사각으로 잘라 두므로, 원본 비율은
     여기서만 볼 수 있습니다. */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.93);
    display:grid;place-items:center;padding:26px;opacity:0;animation:lbin .2s ease forwards}
  @keyframes lbin{to{opacity:1}}
  .lb .inner{max-width:min(900px,92vw);width:100%;text-align:center}
  .lb img{max-width:100%;max-height:72vh;width:auto;margin:0 auto;border-radius:12px}
  .lb .cap{margin-top:16px;font-size:14px}
  .lb .cap .tr{font-size:10px;letter-spacing:2.4px;font-weight:600;
    text-transform:uppercase;margin-top:5px}
  .lb .go{display:inline-block;margin-top:16px;font-size:12px;letter-spacing:1.6px;
    color:var(--gold);border-bottom:1px solid rgba(233,184,74,.4);padding-bottom:2px}
  .lb .x{position:absolute;top:18px;right:22px;background:none;border:0;
    color:var(--muted);font-size:30px;line-height:1;cursor:pointer}
  .lb .x:hover{color:var(--text)}

</style>
</head>
<body>

<header class="head">
  <div class="brand"><a href="index.html"><img src="images/logo.png" alt="MEMONS"></a></div>
  <nav class="nav">
    <a href="index.html#home">HOME</a>
    <a href="index.html#marketplace">MARKETPLACE</a>
    <a href="index.html#capsule">OPEN CAPSULE</a>
    <a href="event.html" class="on">CAMPAIGNS</a>
    <a href="index.html#vault">MEMONS VAULT</a>
    <a href="notice.html">NOTICE</a>
  </nav>
  <div class="hr">
    <div class="soc">
      <a href="https://t.me/APEPE_Official" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.6c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L4.5 13.4l-4.8-1.5c-1-.3-1-.9.2-1.4l18.8-7.2c.9-.3 1.6.2 1.2 1Z"/></svg></a>
      <a href="https://x.com/apepeofficial" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.5 8.6L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8-9.2L1 2h7l4.8 6.3L18.9 2Zm-2.4 18h1.9L7.6 3.9H5.6L16.5 20Z"/></svg></a>
    </div>
    <button class="wbtn" id="hdrAuth">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/></svg>
      <span id="hdrAuthText">SIGN IN</span>
    </button>
  </div>
</header>

<div class="wrap" id="wrap"><div class="spin"></div></div>

<footer class="site">
  <img src="images/logo.png" alt="MEMONS">
  <div>&copy; 2026 MEMONS. All rights reserved.</div>
</footer>

<script src="x-auth.js"></script>
<script src="social-login.js"></script>
<script>
(function(){
  "use strict";

  var BUILD = "2026-11-21 10:20 · The Gallery";
  console.log("MEMONS gallery build " + BUILD);

  var SB_URL  = "https://neixdrtamznrooougcda.supabase.co";
  var SB_ANON = "sb_publishable_xXzlHTJ4cX8kJoEGXw_csw_q5qFK1nO";

  var PAGE = 24;   /* 2·3·4 열 어디서도 마지막 줄이 안 빕니다 */

  var wrap = document.getElementById('wrap');
  var feed = [], C = null, works = [], shown = 0, curKey = '';

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  /* 핸들은 일부만 보입니다. 수상자 명단과 같은 규칙입니다
     (event.html 의 mask) -- 한쪽만 가리면 다른 쪽에서 그대로
     드러나므로 같이 가야 합니다. */
  function mask(h){
    var s=String(h||'');
    if(s.length<=2) return s+'***';
    return s.slice(0, s.length<=5 ? 2 : 4)+'***';
  }

  function rpc(fn, args){
    return fetch(SB_URL+'/rest/v1/rpc/'+fn,{
      method:'POST',
      headers:{'content-type':'application/json',apikey:SB_ANON,
               Authorization:'Bearer '+SB_ANON},
      body:JSON.stringify(args||{})
    }).then(function(r){
      return r.json().catch(function(){return null;}).then(function(j){
        return r.ok?{ok:true,data:j}:{ok:false};
      });
    }).catch(function(){ return {ok:false}; });
  }

  /* 날짜는 UTC 로 고정합니다. 안 그러면 보는 사람의 시간대에 따라
     전시 기간이 하루씩 어긋나 보입니다. */
  function md(d){
    if(!d) return '';
    var x=new Date(d); if(isNaN(x)) return '';
    return x.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).toUpperCase();
  }
  function yr(d){
    if(!d) return '';
    var x=new Date(d); if(isNaN(x)) return '';
    return x.toLocaleDateString('en-US',{year:'numeric',timeZone:'UTC'});
  }
  function period(c){
    if(!c) return '';
    var a=md(c.starts_at), b=md(c.ends_at), y=yr(c.ends_at||c.starts_at);
    if(!a && !b) return '';
    return (a && b ? a+' — '+b : (a||b)) + (y ? ', '+y : '');
  }

  /* 카드로 만든 등급만 겁니다. tier_defs 가 비어 있던 시절의
     캠페인은 예전 규칙으로 봅니다. */
  var LEGACY = {mythic:1, legendary:1, epic:1};
  function cardTiers(){
    var out={}, defs = (C && C.tier_defs) || [];
    if(defs.length){
      defs.forEach(function(t){ if(t && t.card && t.key) out[String(t.key).toLowerCase()]=1; });
      if(Object.keys(out).length) return out;
    }
    return LEGACY;
  }

  function exOptions(){
    return feed.map(function(c){
      return '<option value="'+esc(c.event_key)+'"'+
             (c.event_key===curKey?' selected':'')+'>'+esc(c.title)+'</option>';
    }).join('');
  }

  function shell(body){
    var c = feed.filter(function(x){ return x.event_key===curKey; })[0] || null;
    var sub = (C && C.category ? C.category : 'Campaign') +
              (period(c) ? ' / ' + period(c) : '');

    wrap.innerHTML =
      '<div class="gtop">'+
        '<div>'+
          '<div class="eyebrow">MEMONS / Community Archive</div>'+
          '<h1>The Gallery</h1>'+
        '</div>'+
        (feed.length>1
          ? '<div class="selx"><label>Select exhibition</label>'+
            '<div class="box"><select id="ex">'+exOptions()+'</select></div></div>'
          : '')+
      '</div>'+

      (C ? '<div class="ghero">'+
        (C.image_url?'<img src="'+esc(C.image_url)+'" alt="'+esc(C.title)+'">':'')+
        '<div class="in"><h2>'+esc(C.title)+'</h2>'+
          '<div class="sub">'+esc(sub)+'</div></div>'+
      '</div>' : '')+

      body;

    var sel=document.getElementById('ex');
    if(sel) sel.onchange=function(){ location.hash='c='+encodeURIComponent(this.value); };
  }

  function cardHtml(w, i){
    return '<div class="w" data-i="'+i+'">'+
      '<div class="ph">'+(w.artwork_url
        ? '<img loading="lazy" src="'+esc(w.artwork_url)+'" alt="'+esc(mask(w.x_handle))+'">'
        : '')+'</div>'+
      /* 핸들만 답니다. 전시 제목은 위 배너에 이미 있고, 100장
         아래에 같은 줄이 100번 반복되면 읽히지 않습니다. */
      '<div class="hn">@'+esc(mask(w.x_handle))+'</div>'+
    '</div>';
  }

  function renderWorks(){
    var g=document.getElementById('grid');
    if(!g) return;
    var upto=Math.min(shown, works.length);
    g.innerHTML = works.slice(0,upto).map(cardHtml).join('');

    var row=document.getElementById('moreRow');
    if(row) row.innerHTML = (upto<works.length)
      ? '<button class="moreBtn" id="moreBtn">Load more &nbsp;('+(works.length-upto)+')</button>'
      : '';
    var b=document.getElementById('moreBtn');
    if(b) b.onclick=function(){ shown+=PAGE; renderWorks(); };

    g.querySelectorAll('.w').forEach(function(el){
      el.onclick=function(){ lightbox(works[+el.dataset.i]); };
    });
  }

  function lightbox(w){
    if(!w) return;
    var d=document.createElement('div');
    d.className='lb';
    d.innerHTML='<button class="x" aria-label="Close">&times;</button>'+
      '<div class="inner">'+
        (w.artwork_url?'<img src="'+esc(w.artwork_url)+'" alt="">':'')+
        '<div class="cap">@'+esc(mask(w.x_handle))+
          '<div class="tr">'+esc((C&&C.title)||'')+'</div>'+
        '</div>'+
        (w.post_url?'<a class="go" href="'+esc(w.post_url)+'" target="_blank" rel="noopener">View the original post</a>':'')+
      '</div>';
    document.body.appendChild(d);
    function close(){ d.remove(); document.removeEventListener('keydown', key); }
    function key(e){ if(e.key==='Escape') close(); }
    d.querySelector('.x').onclick=close;
    d.onclick=function(e){ if(e.target===d) close(); };
    document.addEventListener('keydown', key);
  }

  function renderGallery(){
    if(!works.length){
      shell('<div class="empty">No works have been published for this exhibition yet.</div>');
      return;
    }
    shell(
      '<div class="swhead"><span class="t">Selected works</span>'+
        '<span class="rule"></span>'+
        '<span class="n">'+works.length+' artwork'+(works.length===1?'':'s')+'</span></div>'+
      '<div class="ggrid" id="grid"></div>'+
      '<div class="moreRow" id="moreRow"></div>'
    );
    shown = PAGE;
    renderWorks();
  }

  function load(key){
    wrap.innerHTML='<div class="spin"></div>';
    Promise.all([
      rpc('contest_one',{p_event:key}),
      rpc('contest_public_winners',{p_event:key})
    ]).then(function(res){
      C = (res[0].ok && res[0].data) ? res[0].data : null;
      var all = (res[1].ok && Array.isArray(res[1].data)) ? res[1].data : [];

      var ok = cardTiers();
      /* 그림이 없는 줄은 걸 수 없습니다 -- 빈 칸만 남습니다. */
      works = all.filter(function(w){
        return w.artwork_url && ok[String(w.tier||'').toLowerCase()];
      });

      /* 등급 순서는 캠페인이 적어 둔 순서를 그대로 따릅니다.
         화면이 따로 정하면 캠페인마다 뒤집힙니다. */
      var order={}, defs=(C && C.tier_defs)||[];
      defs.forEach(function(t,i){ if(t&&t.key) order[String(t.key).toLowerCase()]=i; });
      works.sort(function(a,b){
        var ta=order[String(a.tier||'').toLowerCase()];
        var tb=order[String(b.tier||'').toLowerCase()];
        if(ta==null) ta=99; if(tb==null) tb=99;
        if(ta!==tb) return ta-tb;
        return (a.rank||0)-(b.rank||0) || String(a.x_handle||'').localeCompare(String(b.x_handle||''));
      });

      renderGallery();
    });
  }

  function route(){
    var m=/(?:^|[#&])c=([^&]+)/.exec(location.hash||'');
    var key=m?decodeURIComponent(m[1]):'';
    if(!key && feed.length) key=feed[0].event_key;
    if(!key){
      wrap.innerHTML='<div class="empty">No exhibitions yet.</div>';
      return;
    }
    curKey=key;
    load(key);
  }

  window.addEventListener('hashchange', function(){ window.scrollTo(0,0); route(); });

  rpc('contest_feed').then(function(r){
    feed = (r.ok && Array.isArray(r.data)) ? r.data : [];
    /* 발표가 끝난 것만 전시합니다. 진행 중인 캠페인의 수상자는
       아직 없거나, 있어도 공개 전입니다. */
    feed = feed.filter(function(c){ return c.status !== 'upcoming'; });
    route();
  });

})();
</script>
</body>
</html>
