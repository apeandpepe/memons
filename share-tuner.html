<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMONS — 공유 이미지 조절</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* 공유 이미지는 1800x942 로 그려진다. 여기서는 화면에 맞게 줄여
     보여주되, 값은 전부 1800x942 기준으로 다룬다. 그래야 조절한
     숫자를 코드에 그대로 옮길 수 있다. */
  :root{--gold:#E9B84A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0b0d;color:#e8e6e0;font-family:var(--font-body),system-ui,sans-serif;
    display:flex;min-height:100vh}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .canvas{position:relative;width:1800px;height:942px;transform-origin:center center;
    background:#000;overflow:hidden;box-shadow:0 0 0 1px #262620}
  .canvas img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .canvas img.card{position:absolute;object-fit:contain}

  /* 값 — 배경에 판이 그려진 등급 */
  .num{position:absolute;display:flex;align-items:center;justify-content:flex-end;
    color:#fff;font-weight:800;line-height:1;white-space:nowrap}

  /* 판 — 배경에 판이 없는 등급 */
  .plate{position:absolute;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .plate .fr1,.plate .fr2,.plate .fr3{position:absolute;display:block}
  .plate .lbl{font-weight:700;color:rgba(255,255,255,.7);position:relative}
  .plate .val{display:flex;align-items:baseline;position:relative;line-height:1;font-weight:800}
  .plate .val u{text-decoration:none;color:rgba(255,255,255,.7)}

  .guide{position:absolute;pointer-events:none;outline:1px dashed rgba(255,80,80,.85)}
  body.noguide .guide{display:none}

  /* ── 조절판 ── */
  .tuner{width:300px;flex:none;background:#0a0a0c;border-left:1px solid rgba(233,184,74,.25);
    padding:14px;overflow-y:auto;font-size:11px;max-height:100vh}
  .tuner h1{font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
  .tuner .note{color:#7a756a;line-height:1.5;margin-bottom:12px}
  .rar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .rar button{flex:1;min-width:50px;padding:7px 3px;background:#1b1b1b;border:1px solid #333;
    color:#ccc;border-radius:6px;font-size:10px;cursor:pointer}
  .rar button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
  .row{margin-bottom:9px}
  .row label{display:flex;justify-content:space-between;color:#9a9382;margin-bottom:3px}
  .row .numin{width:74px;background:#08080a;border:1px solid #333;color:#fff;border-radius:5px;
    padding:2px 5px;font-size:11px;font-weight:700;text-align:right}
  .row .u{color:#6f6a60;margin-left:3px}
  .row input[type=range]{width:100%;accent-color:var(--gold)}
  .sec{color:#6f6a60;letter-spacing:1.5px;font-size:9px;margin:14px 0 6px;
    border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
  .out{background:#08080a;border:1px solid #262620;border-radius:8px;padding:10px;
    color:#9fd8a8;font-family:ui-monospace,monospace;font-size:10px;line-height:1.6;
    white-space:pre-wrap;word-break:break-all}
  .btns{display:flex;gap:6px;margin-top:10px}
  .btns button{flex:1;padding:9px;background:var(--gold);color:#000;border:0;border-radius:7px;
    font-weight:700;font-size:11px;cursor:pointer}
  .btns button.ghost{background:#1b1b1b;color:#ccc;border:1px solid #333}
</style></head>
<body>

<div class="stage"><div class="canvas" id="canvas">
  <img class="bg" id="bg" alt="">
  <img class="card" id="card" alt="">
  <div class="guide" id="guide"></div>
  <div class="num" id="num"></div>
  <div class="plate" id="plate">
    <span class="fr1"></span><span class="fr2"></span><span class="fr3"></span>
    <span class="lbl" id="plbl"></span>
    <span class="val" id="pval"></span>
  </div>
</div></div>

<div class="tuner">
  <h1>공유 이미지 조절</h1>
  <div class="note">1800×942 기준으로 값을 다룹니다.<br>
    COMMON·RARE 는 배경에 판이 있어 숫자만,<br>
    EPIC 이상은 판까지 그립니다. 세 등급이 같은 판을 쓰므로<br>
    하나만 맞추면 셋 다 적용됩니다.</div>
  <div class="rar" id="rar"></div>
  <div id="ctrls"></div>
  <div class="sec">결과</div>
  <div class="out" id="out"></div>
  <div class="btns">
    <button id="copy">복사</button>
    <button class="ghost" id="reset">되돌리기</button>
    <button class="ghost" id="gd">가이드</button>
  </div>
</div>

<script>
var SB="https://neixdrtamznrooougcda.supabase.co/storage/v1/object/public/cards";
var CARD={
  common:   SB+'/common/common_mrh1job2q55.webp',
  rare:     SB+'/rare/rare_mrn95pmfnye.webp',
  epic:     SB+'/epic/epic_mrh1kyc9y66.webp',
  legendary:SB+'/legendary/legendary_mrh1n4xztgt.webp',
  mythic:   SB+'/mythic/mythic_ms5riukaa8b.webp'
};
var BGF={common:'og-common.jpg',rare:'og-rare.jpg',epic:'og-epic.jpg',
         legendary:'og-legendary.jpg',mythic:'og-mythic.jpg'};
var RC={common:'#cfccc4',rare:'#5b9bd5',epic:'#c468d8',legendary:'#E9B84A',mythic:'#e0556a'};
var PRICE={common:'0.60',rare:'0.90',epic:'12.45',legendary:'624.80',mythic:'1840.00'};
var BAKED={common:1,rare:1};   // 배경에 판이 이미 그려진 등급
var RAINBOW='linear-gradient(90deg,#ff3b3b,#ffb03b,#ffe83b,#4bd964,#3bd0ff,#7a5bff,#ff3bd0)';

/* 전부 1800x942 기준. og.js 가 쓰는 좌표계와 같다. */
var DEF={
  common:   {cardW:525, cardBottom:745, right:1052, cy:844, fsNum:24},
  rare:     {cardW:525, cardBottom:745, right:1026, cy:824, fsNum:22},
  /* EPIC 이상은 판 규격이 같다. plate 하나를 셋이 함께 쓴다 —
     따로 두면 같은 값을 세 번 맞춰야 하고, 하나만 어긋나기 쉽다. */
  plate:    {cardW:525, cardBottom:745, pw:470, ph:112, top:800, radius:18,
             fsLabel:22, fsVal:46, fsUnit:22, gapLV:10}
};

var FIELDS={
  baked:[
    ['cardW','카드 폭',200,900,1,'px'],
    ['cardBottom','카드 아랫변',400,942,1,'px'],
    ['right','숫자 오른쪽 끝',400,1700,1,'px'],
    ['cy','숫자 세로 중심',500,942,1,'px'],
    ['fsNum','숫자 크기',10,120,1,'px']
  ],
  plate:[
    ['cardW','카드 폭',200,900,1,'px'],
    ['cardBottom','카드 아랫변',400,942,1,'px'],
    ['pw','판 폭',150,1400,1,'px'],
    ['ph','판 높이',40,300,1,'px'],
    ['top','판 위치(위에서)',400,930,1,'px'],
    ['radius','모서리 둥글기',0,60,1,'px'],
    ['fsLabel','라벨 크기',8,60,1,'px'],
    ['fsVal','값 크기',12,120,1,'px'],
    ['fsUnit','USDT 크기',8,60,1,'px'],
    ['gapLV','라벨-값 간격',-10,60,1,'px']
  ]
};

var cur='common';
var val=JSON.parse(JSON.stringify(DEF));
/* 등급이 어느 값 묶음을 쓰는지. EPIC 이상은 모두 plate 를 가리킨다. */
function slot(r){ return BAKED[r] ? r : 'plate'; }
var $=function(id){return document.getElementById(id);};

function scale(){
  var st=document.querySelector('.stage');
  var s=Math.min((st.clientWidth-40)/1800,(st.clientHeight-40)/942);
  $('canvas').style.transform='scale('+s+')';
}

function buildCtrls(){
  var list=FIELDS[BAKED[cur]?'baked':'plate'], box=$('ctrls');
  box.innerHTML='';
  list.forEach(function(f){
    var k=f[0], row=document.createElement('div'); row.className='row';
    row.innerHTML='<label>'+f[1]+'<span><input class="numin" id="n_'+k+'" type="number" step="'+f[4]+'"><span class="u">'+f[5]+'</span></span></label>'+
      '<input type="range" min="'+f[2]+'" max="'+f[3]+'" step="'+f[4]+'" id="s_'+k+'">';
    box.appendChild(row);
    var sl=$('s_'+k), nb=$('n_'+k);
    sl.value=val[slot(cur)][k]; nb.value=val[slot(cur)][k];
    sl.oninput=function(){ val[slot(cur)][k]=parseFloat(sl.value); nb.value=sl.value; apply(); };
    nb.oninput=function(){ var x=parseFloat(nb.value); if(isNaN(x))return;
      val[slot(cur)][k]=x; sl.value=x; apply(); };
  });
}

function apply(){
  var v=val[slot(cur)], baked=BAKED[cur], c=RC[cur], rainbow=(cur==='mythic');
  $('bg').src='images/og/'+BGF[cur];
  var card=$('card');
  card.src=CARD[cur];
  card.style.width=v.cardW+'px';
  card.style.height='auto';
  card.style.left=Math.round((1800-v.cardW)/2)+'px';
  card.style.top='0px';
  // 아랫변을 맞추려면 실린 뒤 높이를 알아야 한다.
  var h=card.naturalHeight&&card.naturalWidth
      ? v.cardW*card.naturalHeight/card.naturalWidth : v.cardW*1280/958;
  card.style.top=Math.round(v.cardBottom-h)+'px';

  var num=$('num'), plate=$('plate'), gd=$('guide');
  if(baked){
    plate.style.display='none'; num.style.display='flex';
    /* 오른쪽 끝 한 점으로 자리를 정한다. 넉넉한 칸을 그 끝에 맞춰
       붙이므로, 공유 이미지 쪽과 계산이 같다. */
    var BOX=600;
    num.style.left=(v.right-BOX)+'px';
    num.style.top=(v.cy-v.fsNum)+'px';
    num.style.width=BOX+'px';
    num.style.height=(v.fsNum*2)+'px';
    num.style.fontSize=v.fsNum+'px';
    num.textContent=PRICE[cur];
    gd.style.cssText='left:'+(v.right-BOX)+'px;top:'+(v.cy-v.fsNum)+'px;width:'+
      BOX+'px;height:'+(v.fsNum*2)+'px';
  }else{
    num.style.display='none'; plate.style.display='flex';
    var x=Math.round((1800-v.pw)/2);
    plate.style.cssText='display:flex;flex-direction:column;align-items:center;'+
      'justify-content:center;position:absolute;left:'+x+'px;top:'+v.top+'px;'+
      'width:'+v.pw+'px;height:'+v.ph+'px;border-radius:'+v.radius+'px;'+
      (rainbow?('background-image:'+RAINBOW+';'):('background-color:'+c+';'));
    var f=plate.querySelectorAll('span');
    f[0].style.cssText='position:absolute;left:3px;top:3px;width:'+(v.pw-6)+'px;height:'+
      (v.ph-6)+'px;border-radius:'+Math.max(0,v.radius-3)+'px;background:rgba(2,2,4,.97)';
    f[1].style.cssText='position:absolute;left:9px;top:9px;width:'+(v.pw-18)+'px;height:'+
      (v.ph-18)+'px;border-radius:'+Math.max(0,v.radius-8)+'px;border:1px solid '+
      (rainbow?'rgba(255,255,255,.34)':c+'6b');
    f[2].style.cssText='display:none';
    var lbl=$('plbl'), pv=$('pval');
    lbl.textContent='MARKET PRICE (USDT)';
    lbl.style.cssText='position:relative;font-weight:700;color:rgba(255,255,255,.7);'+
      'font-size:'+v.fsLabel+'px;letter-spacing:6px';
    pv.innerHTML=PRICE[cur]+'<u style="font-size:'+v.fsUnit+'px;letter-spacing:3px;margin-left:12px">USDT</u>';
    pv.style.cssText='position:relative;display:flex;align-items:baseline;line-height:1;'+
      'font-weight:800;font-size:'+v.fsVal+'px;margin-top:'+v.gapLV+'px;'+
      (rainbow?('background-image:'+RAINBOW+';-webkit-background-clip:text;background-clip:text;color:transparent;')
             :('color:'+c+';'));
    gd.style.cssText='left:'+x+'px;top:'+v.top+'px;width:'+v.pw+'px;height:'+v.ph+'px';
  }
  dump();
}

function dump(){ $('out').textContent=JSON.stringify(val,null,1); }

['common','rare','epic','legendary','mythic'].forEach(function(k){
  var b=document.createElement('button');
  b.textContent=k.slice(0,3).toUpperCase();
  if(k===cur) b.className='on';
  b.onclick=function(){
    cur=k;
    Array.prototype.forEach.call($('rar').children,function(x){x.classList.remove('on');});
    b.classList.add('on'); buildCtrls(); apply();
  };
  $('rar').appendChild(b);
});

$('copy').onclick=function(){ navigator.clipboard.writeText($('out').textContent).then(function(){
  $('copy').textContent='복사됨'; setTimeout(function(){$('copy').textContent='복사';},1200); }); };
$('reset').onclick=function(){ val[slot(cur)]=JSON.parse(JSON.stringify(DEF[slot(cur)])); buildCtrls(); apply(); };
$('gd').onclick=function(){ document.body.classList.toggle('noguide'); };

$('card').addEventListener('load', apply);
window.addEventListener('resize', scale);
buildCtrls(); apply(); scale();
</script>
</body></html>
