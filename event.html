<!DOCTYPE html>
<!--
  MEMONS — event.html   (Campaigns)

    event.html              캠페인 목록
    event.html#c=<key>      캠페인 상세 — Overview / Participate / Results

  한 파일인 이유는 올릴 것이 하나여야 하기 때문입니다. 목록과 상세가
  쓰는 머리글·색·카드가 전부 같아서, 둘로 나누면 한쪽만 고치는 일이
  반드시 생깁니다.

  주소에 ? 가 아니라 # 를 쓰는 이유: vercel.json 의 cleanUrls 가 .html
  을 떼면서 주소를 다시 쓰는데, 그때 ? 뒤가 사라집니다. # 뒤는 서버로
  가지 않으므로 어떤 서버에 올려도 같게 동작합니다.

  참가 인증의 핵심은 서버에 있습니다(step103). 붙여넣은 주소의 핸들이
  로그인한 X 계정과 같을 때만 접수됩니다 — 화면에서만 막으면 화면을
  거치지 않는 요청에는 소용이 없습니다.

  필요: x-auth.js · social-login.js · step94~104
        social(/x 포함) · game({contest:…})
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMONS &mdash; Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<!-- 표제용. 시안이 쓰는 기하학적 산세리프에 맞춥니다. 본문은 사이트
     폰트를 그대로 쓰므로 다른 페이지와 읽는 느낌이 어긋나지 않습니다. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#070707; --panel:#101010; --panel2:#161616; --panel3:#1c1c1c;
    --gold:#E9B84A; --gold-a:#f4d27a; --gold-b:#b8862e;
    --cta-a:#f0d089; --cta-b:#d9ab4d;
    --line:rgba(233,184,74,.22); --hair:rgba(255,255,255,.07);
    --text:#f2efe9; --muted:#8d8a82; --faint:#605d57;
    --green:#4ad07f; --red:#e0556a;
    --c-mythic:#b9a7ff; --c-legendary:#E9B84A; --c-epic:#c468d8;
    --display:'Outfit',var(--font-head,var(--font-body)),-apple-system,sans-serif;
  }
  /* 표제는 전부 이 한 줄을 거칩니다. 폰트를 바꿀 일이 생기면
     --display 하나만 고치면 됩니다. */
  h1,h2,h3,h4,.tag2,.crew b,.facts .pool,.stat .n,.yours .rk,td.rk,.cta{
    font-family:var(--display);letter-spacing:-.02em}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button,input{font-family:inherit}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ===== header =====
     수치는 marketplace.html · collection.html 과 한 글자도 다르지 않게
     맞춰 둔 것입니다. 여기만 고치면 메뉴 위치가 다시 어긋납니다. */
  .head{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:14px 36px;border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{height:44px;width:auto;display:block}
  .nav{display:flex;gap:34px;font-size:13px;letter-spacing:1.4px;color:#cdcabf;font-weight:600}
  .nav a{position:relative;padding:6px 0;transition:color .2s}
  .nav a:hover{color:#fff}
  .nav a.on{color:var(--gold)}
  .nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-20px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .hr{display:flex;align-items:center;gap:20px}
  .soc{display:flex;gap:16px;color:#b7b4ac}
  .soc a{display:grid;place-items:center;transition:color .2s}
  .soc a:hover{color:var(--gold)}
  .soc svg{width:18px;height:18px;fill:currentColor}
  .wbtn{border:1px solid var(--gold);color:var(--gold);background:transparent;
    padding:10px 16px;border-radius:8px;font-weight:600;
    font-size:12px;letter-spacing:1.4px;cursor:pointer;transition:.2s;white-space:nowrap;
    display:flex;align-items:center;gap:8px}
  .wbtn:hover{background:var(--gold);color:#000}
  .wbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
  @media(max-width:1040px){.nav,.soc{display:none}}

  .wrap{max-width:1240px;margin:0 auto;padding:60px 34px 110px}

  /* ===== type ===== */
  .eyebrow{font-size:11px;letter-spacing:3.2px;color:var(--muted);font-weight:600;
    text-transform:uppercase}
  h1{font-size:clamp(40px,5.4vw,74px);font-weight:700;line-height:.98;letter-spacing:-.035em;margin:16px 0 10px;text-wrap:balance}
  .tag2{font-size:clamp(20px,2.3vw,31px);font-weight:600;letter-spacing:-.025em;color:var(--text);margin-bottom:14px}
  .lede{font-size:15px;color:var(--muted);line-height:1.7}
  .headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    flex-wrap:wrap;margin-bottom:42px}
  .sidenote{font-size:10.5px;letter-spacing:2.6px;color:var(--faint);
    text-transform:uppercase;padding-bottom:6px;white-space:nowrap}

  /* ===== tabs + search ===== */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;
    flex-wrap:wrap;margin-bottom:26px;border-bottom:1px solid var(--hair)}
  .tabs{display:flex;gap:30px}
  .tab{background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;
    padding:0 0 13px;cursor:pointer;position:relative;transition:color .2s}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--gold);font-weight:600}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:var(--gold)}
  .search{display:flex;align-items:center;gap:9px;background:var(--panel2);
    border:1px solid var(--hair);border-radius:9px;padding:9px 14px;margin-bottom:11px;
    min-width:250px}
  .search svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.8;flex:none}
  .search input{background:none;border:0;outline:0;color:var(--text);font-size:13.5px;width:100%}
  .search input::placeholder{color:var(--faint)}

  /* ===== campaign cards ===== */
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(312px,1fr))}
  .card{border:1px solid var(--hair);border-radius:16px;background:var(--panel);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s}
  .card:hover{transform:translateY(-4px);border-color:var(--line);
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
  /* 진행중인 카드만 테두리를 올립니다. 전부 빛나면 아무것도 안 빛납니다. */
  .card.live{border-color:rgba(233,184,74,.45);
    box-shadow:0 0 0 1px rgba(233,184,74,.07) inset}
  .card.live:hover{box-shadow:0 18px 44px -20px rgba(233,184,74,.22)}
  .thumb{aspect-ratio:16/9;background:var(--panel2);position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#1a1812,#0d0d0d);
    color:rgba(233,184,74,.3);font-size:32px;font-weight:700;letter-spacing:3px}
  .pill{position:absolute;top:13px;left:13px;display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px 5px 9px;border-radius:999px;font-size:11px;font-weight:600;
    letter-spacing:.4px;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.1)}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .pill.live{color:var(--green)} .pill.ended{color:var(--muted)} .pill.upcoming{color:var(--gold)}
  .cbody{padding:19px 21px 21px;display:flex;flex-direction:column;flex:1;min-width:0}
  .ccat{font-size:10.5px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase;
    margin-bottom:10px}
  .ctop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ctop h3{font-size:23px;font-weight:700;line-height:1.22;min-width:0}
  .arr{color:var(--muted);flex:none;transition:.2s}
  .card:hover .arr{color:var(--gold);transform:translateX(3px)}
  .arr svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}
  .cdate{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
    margin-top:12px}
  .cdate svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}
  .crew{margin-top:auto;padding-top:15px;border-top:1px solid var(--hair);
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:18px}
  .crew span{font-size:12.5px;color:var(--muted)}
  .crew b{font-size:21px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}

  /* ===== detail ===== */
  .crumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);
    margin-bottom:26px}
  .crumb a:hover{color:var(--gold)}
  .crumb .sep{color:var(--faint)}
  .crumb .cur{color:var(--text)}

  .hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;
    padding-bottom:48px}
  /* 16:9. 목록 카드(.thumb)와 같은 비율이고, 관리자 화면이 올리라고
     적어 둔 크기(1200×675)와도 같습니다. 여기만 4:3 이어서, 같은
     그림인데 상세에서만 좌우가 잘려 나갔습니다. */
  .hero .pic{border:1px solid var(--hair);border-radius:14px;overflow:hidden;
    background:var(--panel2);aspect-ratio:16/9}
  .hero .pic img{width:100%;height:100%;object-fit:cover}
  .meta{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:2px;
    text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .meta .dot{display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .meta .dot i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .meta .bar2{width:1px;height:12px;background:var(--hair)}
  h2.big{font-size:clamp(34px,4.6vw,62px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-bottom:16px;text-wrap:balance}
  .hero .sub{font-size:15px;color:var(--muted);line-height:1.7;padding-bottom:26px;
    border-bottom:1px solid var(--hair)}
  .facts{display:flex;gap:46px;flex-wrap:wrap;padding:24px 0 28px}
  .facts .k{font-size:10.5px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;
    margin-bottom:9px}
  .facts .pool{font-size:30px;font-weight:700;color:var(--gold);letter-spacing:-.6px}
  .facts .per{display:flex;align-items:center;gap:9px;font-size:14px;padding-top:6px}
  .facts .per svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.6}

  .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:linear-gradient(135deg,var(--cta-a),var(--cta-b));color:#1a1403;
    border:0;border-radius:10px;padding:17px 26px;font-size:16px;font-weight:700;
    letter-spacing:-.2px;cursor:pointer;transition:.18s}
  .cta:hover:not(:disabled){filter:brightness(1.07)}
  .cta:disabled{opacity:.45;cursor:default}
  /* nowrap: 이 작은 버튼은 좁은 칸(결과표 한 칸, 수상 배너 끝)에 들어가서,
     두면 "Issue / my / card" 처럼 세 줄로 접힙니다. */
  .cta.sm{width:auto;padding:12px 22px;font-size:13.5px;border-radius:9px;white-space:nowrap}
  .ulink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);
    border-bottom:1px solid var(--hair);padding-bottom:3px;margin-top:18px;transition:.2s}
  .ulink:hover{color:var(--gold);border-color:var(--line)}

  /* tier stats */
  /* 등급 수가 캠페인마다 다릅니다(step110). 세 칸으로 못 박아 두면
     다섯 등급짜리가 3+2 로 접혀 오른쪽이 비어 보입니다. */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .stat{text-align:center;padding:36px 16px;position:relative}
  .stat + .stat::before{content:"";position:absolute;left:0;top:26px;bottom:26px;
    width:1px;background:var(--hair)}
  .stat i{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 14px}
  .stat .n{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .t{font-size:12.5px;letter-spacing:2.4px;font-weight:600;margin-top:11px}
  .stat .w{font-size:12.5px;color:var(--muted);margin-top:5px}

  /* section tabs */
  .steps{display:flex;align-items:center;justify-content:center;gap:4px;
    padding:28px 0 0;flex-wrap:wrap}
  .step{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;
    padding:8px 16px;position:relative;transition:color .2s;display:flex;gap:9px}
  .step em{font-style:normal;color:var(--faint);font-size:12.5px}
  .step:hover{color:var(--text)}
  .step.on{color:var(--text);font-weight:600}
  .step.on em{color:var(--gold)}
  .step.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;
    background:var(--gold)}
  .slash{color:var(--faint);font-size:13px}

  .sect{padding:62px 0 0}

  /* overview / partner */
  .prose{font-size:15px;line-height:1.85;color:#cdcac2;max-width:760px}
  .prose p{margin-bottom:16px}
  .prose p:last-child{margin-bottom:0}

  /* 가로형. 시안의 파트너 그림이 정사각형이 아니라 2:1 에 가깝고,
     칸도 더 넓게 잡혀 있습니다. */
  .partner{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:44px;align-items:start;
    padding:40px 0;border-top:1px solid var(--hair);margin-top:40px}
  /* 본문이 없어지면서 파트너가 구역의 첫 칸이 되었습니다. 그때는
     위 선과 여백이 빈 띠로만 남습니다 -- 위 등급 칸의 아래 선이
     이미 구분선 노릇을 합니다. */
  .partner:first-child{border-top:0;margin-top:0;padding-top:8px}
  .partner .pic{border-radius:12px;overflow:hidden;background:var(--panel2);aspect-ratio:2/1}
  .partner .pic img{width:100%;height:100%;object-fit:cover}
  .partner h3{font-size:clamp(26px,2.8vw,38px);font-weight:700;letter-spacing:-.03em;margin:12px 0 15px}
  .partner p{font-size:15px;color:var(--muted);line-height:1.75;max-width:520px}
  .plinks{display:flex;align-items:center;gap:22px;margin-top:22px;flex-wrap:wrap}
  .plinks a{font-size:13.5px;border-bottom:1px solid var(--hair);padding-bottom:3px;
    display:inline-flex;gap:6px;transition:.2s}
  .plinks a:hover{color:var(--gold);border-color:var(--line)}
  .plinks .bar2{width:1px;height:13px;background:var(--hair)}

  /* participate */
  .enter h3{font-size:clamp(30px,3.8vw,52px);font-weight:700;letter-spacing:-.035em;margin-bottom:10px;text-wrap:balance}
  .enter .sub{font-size:15px;color:var(--muted);margin-bottom:38px}
  .cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:44px;align-items:start}
  .vline{background:var(--hair);align-self:stretch}
  .num{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2.4px;
    color:var(--muted);text-transform:uppercase;margin-bottom:16px}
  .num b{color:var(--gold);font-weight:700}
  .cols h4{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-bottom:13px}
  .cols p{font-size:14px;color:var(--muted);line-height:1.75}
  .handles{display:flex;gap:20px;margin:18px 0 22px;flex-wrap:wrap}
  .handles a{font-size:13.5px;color:var(--text);border-bottom:1px solid var(--line);
    padding-bottom:3px}
  .handles a:hover{color:var(--gold)}
  .slogan{display:flex;align-items:center;gap:14px;background:var(--panel2);
    border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-top:16px}
  .slogan div{flex:1;min-width:0}
  .slogan .k{font-size:10px;letter-spacing:2.2px;color:var(--faint);text-transform:uppercase;
    margin-bottom:7px}
  .slogan .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    color:var(--text);word-break:break-word}
  .copy{background:none;border:0;cursor:pointer;color:var(--muted);flex:none;padding:4px}
  .copy:hover{color:var(--gold)}
  .copy svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}

  .fld{margin-bottom:18px}
  .fld .k{font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .xrow{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--hair);border-radius:9px;padding:9px 10px 9px 14px}
  .xrow svg{width:15px;height:15px;fill:currentColor;flex:none}
  .xrow span{flex:1;font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .xrow span.ok{color:var(--green)}
  .inp{width:100%;background:var(--panel2);border:1px solid var(--hair);border-radius:9px;
    color:var(--text);font-size:13.5px;padding:13px 14px;outline:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .inp:focus{border-color:var(--line)}
  .inp::placeholder{color:var(--faint);font-family:var(--font-body,inherit)}
  .chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--muted);
    cursor:pointer;margin-bottom:20px;line-height:1.6}
  .chk input{width:16px;height:16px;margin-top:1px;cursor:pointer;flex:none;accent-color:var(--gold)}
  .chk a{color:var(--text);border-bottom:1px solid var(--hair)}
  .chk a:hover{color:var(--gold)}
  .note{font-size:12.5px;color:var(--faint);text-align:center;margin-top:13px;line-height:1.6}
  .msg{font-size:13px;margin-top:13px;line-height:1.6}
  .msg.bad{color:var(--red)} .msg.ok{color:var(--green)}

  .mine{margin-top:26px;border-top:1px solid var(--hair);padding-top:20px}
  .mine .k{font-size:11px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;
    margin-bottom:12px}
  .erow{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:13px;
    border-bottom:1px solid var(--hair)}
  .erow a{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .erow a:hover{color:var(--gold)}
  .st{font-size:11px;letter-spacing:1.2px;font-weight:600;text-transform:uppercase;flex:none}
  .st.pending{color:var(--gold)} .st.accepted{color:var(--green)} .st.rejected{color:var(--red)}
  .xbtn{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;flex:none}
  .xbtn:hover{color:var(--red)}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:20px;
    flex-wrap:wrap;margin-top:44px;padding-top:22px;border-top:1px solid var(--hair);
    font-size:13px;color:var(--muted)}

  /* results */
  .yours{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:16px 20px;margin-bottom:28px}
  .yours .k{font-size:10.5px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase}
  .yours .rk{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .yours .sp{flex:1}
  .ed{display:inline-block;padding:4px 11px;border-radius:999px;font-size:10.5px;
    font-weight:700;letter-spacing:1.4px}
  .ed.mythic{color:var(--c-mythic);background:rgba(185,167,255,.13);border:1px solid rgba(185,167,255,.3)}
  .ed.legendary{color:var(--c-legendary);background:rgba(233,184,74,.13);border:1px solid rgba(233,184,74,.3)}
  .ed.epic{color:var(--c-epic);background:rgba(196,104,216,.13);border:1px solid rgba(196,104,216,.3)}
  .ed.participation{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--hair)}

  /* 표는 좁은 화면에서 줄지 않는 칸(순위·등급·버튼)이 있어서, 폭이 모자라면
     페이지 전체를 옆으로 밀어 버립니다. 표만 따로 스크롤시켜 가둡니다. */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* X 인증 전에는 명단을 흐리게 덮습니다. 핸들은 어차피 가려져
     있어서 보여 줘도 되지만, 600줄을 그냥 펼쳐 두면 확인할 곳이
     어디인지 아무도 못 찾습니다. 흐리게 두면 확인창 하나만 남습니다.

     가리는 장치가 아니라 길 안내입니다 -- 흐림은 보기에만 걸리고
     내용은 그대로 있습니다. 진짜로 가리는 것은 서버에서 핸들을
     마스킹한 쪽입니다. */
  .veil{position:relative;overflow:hidden}
  .veil .tscroll,
  .veil .vbar{filter:blur(5px);opacity:.45;pointer-events:none;user-select:none}
  /* 500줄을 전부 흐리게 깔면 화면이 한참 내려갑니다. 몇 줄만
     남기고 아래를 어둡게 덮어 둡니다 -- 명단이 있다는 것만
     보이면 됩니다. */
  .veil .tscroll{max-height:380px}
  .veil::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;
    background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:1}
  .vask{position:absolute;inset:0;display:flex;align-items:flex-start;
    justify-content:center;padding-top:64px;z-index:2}
  .vcard{background:rgba(16,16,18,.92);border:1px solid var(--line);
    border-radius:16px;padding:26px 28px;max-width:420px;text-align:center;
    backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .vcard .k{font-size:10.5px;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;font-weight:600}
  .vcard p{margin:10px 0 18px;font-size:15px;line-height:1.6;color:var(--text)}
  /* .cta 는 본디 큰 버튼이라, 안에 든 X 아이콘이 카드만 해집니다. */
  .vcard .cta{width:100%;display:inline-flex;align-items:center;
    justify-content:center;gap:9px;padding:13px 20px;font-size:14px}
  .vcard .cta svg{width:15px;height:15px;flex:0 0 auto}
  @media(max-width:640px){.vask{padding-top:40px}.vcard{padding:22px 20px}}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:10.5px;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;font-weight:600;padding:0 14px 14px;border-bottom:1px solid var(--hair)}
  tbody td{padding:14px;border-bottom:1px solid var(--hair);font-size:14px;vertical-align:middle}
  tbody tr.me{background:var(--panel2)}
  .rk{font-size:17px;font-weight:700;letter-spacing:-.4px;width:62px}
  .art{width:220px}
  .art img{width:200px;height:68px;object-fit:cover;border-radius:7px;background:var(--panel3)}
  .art .none{width:200px;height:68px;border-radius:7px;background:var(--panel3);
    display:grid;place-items:center;color:var(--faint);font-size:11px}
  .who{color:var(--text)}
  .view{font-size:13px;color:var(--muted);border-bottom:1px solid var(--hair);
    padding-bottom:2px;display:inline-flex;gap:5px}
  .view:hover{color:var(--gold)}

  .empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14.5px}
  .spin{width:22px;height:22px;margin:70px auto;border-radius:50%;
    border:2px solid rgba(233,184,74,.2);border-top-color:var(--gold);
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  footer.site{border-top:1px solid var(--hair);padding:26px 34px;display:flex;
    align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-size:12.5px;color:var(--faint)}
  footer.site img{height:26px;opacity:.75}
  footer.site a{color:var(--muted)}
  footer.site a:hover{color:var(--gold)}

  @media(max-width:980px){
    .hero{grid-template-columns:1fr;gap:28px}
    h1{font-size:44px} h2.big{font-size:38px}
    .cols{grid-template-columns:1fr;gap:38px}
    .vline{display:none}
    .partner{grid-template-columns:1fr;gap:24px}
    .partner .pic{max-width:420px;aspect-ratio:2/1}
    .enter h3{font-size:34px}
    .art,.art img,.art .none{width:120px}
    .art img,.art .none{height:48px}
  }
  @media(max-width:620px){
    .head{padding:12px 16px}
    .wrap{padding:32px 16px 70px}
    h1{font-size:34px} h2.big{font-size:30px} .tag2{font-size:20px}
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
    .stat + .stat::before{left:26px;right:26px;top:0;bottom:auto;width:auto;height:1px}
    .facts{gap:28px}
    .search{min-width:0;width:100%}
    thead th:nth-child(2),tbody td:nth-child(2){display:none}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* 어느 판이 올라가 있는지 확인용. 덮어썼다고 생각했는데 옛 파일이
     열려 있으면, 멀쩡한 코드를 한참 뒤지게 됩니다. 콘솔(F12) 첫 줄에
     찍힙니다. */
  var BUILD = "2026-11-10 17:30 · 결과 확인창 + 블러";
  try{ console.log("%cMEMONS campaigns build "+BUILD,
                   "color:#E9B84A;font-weight:700"); }catch(e){}

  var SB_URL  = "https://neixdrtamznrooougcda.supabase.co";
  var SB_ANON = "sb_publishable_xXzlHTJ4cX8kJoEGXw_csw_q5qFK1nO";
  var API     = SB_URL + "/functions/v1";

  var wrap = document.getElementById('wrap');

  // ── helpers ─────────────────────────────────────────────────────
  function tok(){
    try{ return (window.MEMONS && window.MEMONS.token) || localStorage.getItem('memons_jwt_v1') || ''; }
    catch(e){ return ''; }
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }
  /* 'en-US' 를 못 박습니다. 비워 두면 브라우저 언어를 따라가서,
     한국에서 보면 영어 페이지에 날짜만 한글로 나옵니다. */
  /* UTC 로 그립니다.

     보는 사람의 시간대로 바꾸면, 같은 캠페인이 한국에서는 Nov 8,
     미국에서는 Nov 7 로 보입니다. 마감이 UTC 기준이고 공지도 그
     날짜로 나가므로, 화면도 그 하나를 보여야 합니다 -- 11/7 23:59
     UTC 마감이 한국 사람에게 Nov 8 로 보이면 하루를 더 있는 줄
     압니다. */
  function fmt(d){
    if(!d) return '';
    var x=new Date(d); if(isNaN(x)) return '';
    return x.toLocaleDateString('en-US',
      {month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
  }
  function period(c){
    if(!c.starts_at && !c.ends_at) return 'To be announced';
    return fmt(c.starts_at) + (c.ends_at ? ' – ' + fmt(c.ends_at) : '');
  }
  function paras(t){
    return String(t||'').split(/\n\s*\n/).filter(function(p){return p.trim();})
      .map(function(p){ return '<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>'; }).join('');
  }

  function rpc(fn, args){
    return fetch(SB_URL+'/rest/v1/rpc/'+fn,{
      method:'POST',
      headers:{'content-type':'application/json',apikey:SB_ANON,
               Authorization:'Bearer '+SB_ANON},
      body:JSON.stringify(args||{})
    }).then(function(r){
      return r.json().catch(function(){return null;}).then(function(j){
        return r.ok?{ok:true,data:j}:{ok:false};
      });
    }).catch(function(){ return {ok:false}; });
  }

  /* {ok,data,code} 로 답합니다. 여기서 나는 실패는 대부분 사람에게
     할 말이 따로 있고, throw 로 묶으면 그게 전부 하나가 됩니다. */
  function game(body){
    var h={'content-type':'application/json'}, t=tok();
    if(t) h.Authorization='Bearer '+t;
    return fetch(API+'/game',{method:'POST',headers:h,body:JSON.stringify(body)})
      .then(function(r){
        return r.json().catch(function(){return {};}).then(function(j){
          return r.ok?{ok:true,data:j}:{ok:false,code:j.error||('HTTP'+r.status)};
        });
      }).catch(function(){ return {ok:false,code:'NETWORK'}; });
  }

  // ── icons ───────────────────────────────────────────────────────
  var I={
    x:'<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.5 8.6L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8-9.2L1 2h7l4.8 6.3L18.9 2Zm-2.4 18h1.9L7.6 3.9H5.6L16.5 20Z"/></svg>',
    cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    arr:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
    find:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    cp:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
  };
  var OUT='↗';
  var STATUS={live:'Live', ended:'Ended', upcoming:'Upcoming'};
  /* 등급은 캠페인이 정합니다 (step110).

     전에는 mythic/legendary/epic 세 개가 여기 박혀 있었습니다. 카드
     뽑기 등급을 그대로 쓴 것인데, 컨테스트는 매번 다릅니다 -- 1st /
     2nd / 3rd / additional / random 같은 것이 들어올 자리가 없었습니다.

     정의가 없는 옛 캠페인은 예전 세 등급으로 그립니다. */
  var LEGACY=[{key:'mythic',label:'MYTHIC',color:'#b9a7ff'},
              {key:'legendary',label:'LEGENDARY',color:'#E9B84A'},
              {key:'epic',label:'EPIC',color:'#c468d8'}];
  function tiers(){
    return (C && C.tier_defs && C.tier_defs.length) ? C.tier_defs : LEGACY;
  }
  /* 카드를 주는 등급인가 (step111).

     'Issue my card' 는 캡슐 화면으로 보내 카드를 받게 하는 버튼이라,
     상품이 토큰인 등급에서는 눌러도 받을 것이 없습니다. 등급 정의가
     켜 준 등급에서만 세웁니다. 정의가 없는 옛 캠페인은 지금까지대로
     mythic/legendary/epic 이 카드입니다. */
  function isCard(key){
    if(C && C.tier_defs && C.tier_defs.length) return !!tierOf(key).card;
    return key==='mythic' || key==='legendary' || key==='epic';
  }
  /* 공개 명단의 핸들은 일부만 보여 줍니다.

     전체를 적어 두면 제3자가 당첨자를 그대로 추려 갈 수 있습니다 --
     DM 으로 "수상 확인은 여기서" 라며 접근하는 사칭이 붙을 자리가
     바로 그 목록입니다. 본인은 자기 줄이 가려지지 않으므로(아래
     isMe) 자기 것을 알아보는 데 문제가 없습니다. */
  function mask(h){
    var s=String(h||'');
    if(s.length<=2) return s+'***';
    return s.slice(0, s.length<=5 ? 2 : 4)+'***';
  }
  function tierOf(key){
    var l=tiers();
    for(var i=0;i<l.length;i++) if(l[i].key===key) return l[i];
    return {key:key, label:String(key||'').toUpperCase(), color:'#8d8a82'};
  }
  /* 배지 색. 등급마다 색이 달라서 CSS 클래스로는 감당이 안 됩니다 --
     캠페인이 색을 정하므로 줄마다 직접 입힙니다. */
  function edge(key){
    var c=tierOf(key).color||'#8d8a82';
    return '<span class="ed" style="color:'+esc(c)+';background:'+esc(c)+'1f;'+
      'border:1px solid '+esc(c)+'4d">'+esc(tierOf(key).label)+'</span>';
  }

  function pill(st){
    return '<span class="pill '+esc(st)+'"><i></i>'+(STATUS[st]||'')+'</span>';
  }
  function thumb(c){
    var ini=String(c.title||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/)
             .filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase()||'M';
    return '<div class="thumb">'+
      (c.image_url?'<img src="'+esc(c.image_url)+'" alt="" loading="lazy">'
                  :'<div class="ph">'+esc(ini)+'</div>')+
      pill(c.status)+'</div>';
  }

  // ════════════════════════════════════════════════ LIST ══════════

  var feed=[], filter='all', q='';

  function renderList(){
    var t=q.trim().toLowerCase();
    var list=feed.filter(function(c){
      if(filter==='live'  && c.status!=='live')  return false;
      if(filter==='ended' && c.status!=='ended') return false;
      if(t && String(c.title||'').toLowerCase().indexOf(t)<0 &&
              String(c.category||'').toLowerCase().indexOf(t)<0) return false;
      return true;
    });

    wrap.innerHTML=
      '<div class="headrow"><div>'+
        '<div class="eyebrow">The Creator Series</div>'+
        '<h1>Campaigns</h1>'+
        '<div class="tag2">Create. Win. Become a collectible.</div>'+
        '<div class="lede">Compete for rewards. Selected creations become MEMONS cards.</div>'+
      '</div><div class="sidenote">Creativity, Collected.</div></div>'+

      '<div class="bar">'+
        '<div class="tabs">'+
          [['all','All'],['live','Ongoing'],['ended','Ended']].map(function(f){
            return '<button class="tab'+(filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>';
          }).join('')+
        '</div>'+
        '<label class="search">'+I.find+
          '<input id="q" placeholder="Search campaigns…" value="'+esc(q)+'"></label>'+
      '</div>'+

      (list.length
        ? '<div class="grid">'+list.map(function(c){
            return '<a class="card'+(c.status==='live'?' live':'')+'" href="#c='+
                     encodeURIComponent(c.event_key)+'">'+
              thumb(c)+
              '<div class="cbody">'+
                '<div class="ccat">'+esc(c.category||'Campaign')+'</div>'+
                '<div class="ctop"><h3>'+esc(c.title)+'</h3><span class="arr">'+I.arr+'</span></div>'+
                '<div class="cdate">'+I.cal+esc(period(c))+'</div>'+
                '<div class="crew"><span>Reward pool</span><b>'+
                   esc(c.reward_text||'TBA')+'</b></div>'+
              '</div></a>';
          }).join('')+'</div>'
        : '<div class="empty">No campaigns yet. Check back soon.</div>');

    wrap.querySelectorAll('.tab').forEach(function(b){
      b.onclick=function(){ filter=b.dataset.f; renderList(); };
    });
    var qi=document.getElementById('q');
    qi.oninput=function(){
      q=qi.value; renderList();
      /* 한 글자마다 화면을 새로 그리므로, 커서를 있던 자리에 돌려
         놓지 않으면 검색창에서 튕겨 나갑니다. */
      var n=document.getElementById('q');
      n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    };
  }

  function loadList(){
    wrap.innerHTML='<div class="spin"></div>';
    rpc('contest_feed').then(function(r){
      feed=(r.ok && Array.isArray(r.data))?r.data:[];
      renderList();
    });
  }

  // ══════════════════════════════════════════════ DETAIL ══════════

  var C=null, wins=[], myWins=[], me=null,
      rq='', rtier='all', rpage=1, xpending=null;

  /* 한 등급이 500명인 캠페인이 있습니다. 한 장에 다 그리면 표가
     수천 줄이 되고, 전화에서는 아예 못 넘깁니다. */
  var PER=50;

  function heroHtml(){
    var t=C.tiers||{};
    var any=tiers().some(function(x){ return t[x.key]; });

    return '<div class="crumb"><a href="#">← Campaigns</a>'+
        '<span class="sep">/</span><span class="cur">'+esc(C.title)+'</span></div>'+

      '<div class="hero">'+
        '<div class="pic">'+(C.image_url
          ? '<img src="'+esc(C.image_url)+'" alt="'+esc(C.title)+'">' : '')+'</div>'+
        '<div>'+
          '<div class="meta">'+
            '<span class="dot '+esc(C.status)+'" style="color:'+
              (C.status==='live'?'var(--green)':C.status==='upcoming'?'var(--gold)':'var(--muted)')+
              '"><i></i>'+(STATUS[C.status]||'')+'</span>'+
            '<span class="bar2"></span><span>'+esc(C.category||'Campaign')+'</span>'+
          '</div>'+
          '<h2 class="big">'+esc(C.title)+'</h2>'+
          '<div class="sub">'+esc(C.summary||'')+'</div>'+
          '<div class="facts">'+
            '<div><div class="k">Reward pool</div>'+
              '<div class="pool">'+esc(C.reward_text||'TBA')+'</div></div>'+
            '<div><div class="k">Campaign period</div>'+
              '<div class="per">'+I.cal+esc(period(C))+'</div></div>'+
          '</div>'+
          (C.link_url
            ? '<a class="cta" href="'+esc(C.link_url)+'" target="_blank" rel="noopener">'+
                'Participate on X <span>'+OUT+'</span></a>'
            : '<button class="cta" disabled>Participation link coming soon</button>')+
          (C.rules_url
            ? '<br><a class="ulink" href="'+esc(C.rules_url)+'" target="_blank" rel="noopener">'+
                'View campaign rules '+OUT+'</a>' : '')+
        '</div>'+
      '</div>'+

      (any ? '<div class="stats">'+tiers().map(function(x){
          var n=t[x.key]||0;
          return '<div class="stat">'+
            '<i style="background:'+esc(x.color||'#E9B84A')+'"></i>'+
            '<div class="n">'+(n<100?String(n).padStart(2,'0'):String(n))+'</div>'+
            '<div class="t" style="color:'+esc(x.color||'#E9B84A')+'">'+esc(x.label)+'</div>'+
            /* 상품이 적혀 있으면 그걸 보여 줍니다. 등급 이름만으로는
               1st 와 2nd 가 얼마나 다른지 알 수 없습니다. */
            '<div class="w">'+(x.prize?esc(x.prize):'winners')+'</div></div>';
        }).join('')+'</div>' : '')+'';
  }

  /* 탭을 없앴습니다.

     Overview / Participate / Results 로 나눠 두었더니, 참가하려는
     사람이 탭을 한 번 더 눌러야 했고 결과를 보러 온 사람도 마찬가지
     였습니다. 캠페인은 X 에서 돌아가므로 참가 인증을 사이트로 끌고
     오는 대신, 소개와 결과만 한 장에 이어 둡니다. */
  function secAbout(){
    var p=C.partner;
    /* 본문은 싣지 않습니다. 참가 방법은 X 공지에 있고, 여기까지
       옮겨 적으면 두 곳을 함께 고쳐야 합니다 -- 한쪽만 고치는 날이
       반드시 옵니다. 파트너 소개만 둡니다. */
    if(!p) return '';
    return '<div class="sect">'+
      (p ? '<div class="partner">'+
        '<div class="pic">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'')+'</div>'+
        '<div>'+
          '<div class="eyebrow">Partner IP</div>'+
          '<h3>About '+esc(p.name)+'</h3>'+
          (p.body?'<p>'+esc(p.body)+'</p>':'')+
          '<div class="plinks">'+
            (p.site?'<a href="'+esc(p.site)+'" target="_blank" rel="noopener">Website '+OUT+'</a>':'')+
            (p.site&&p.x?'<span class="bar2"></span>':'')+
            (p.x?'<a href="'+esc(p.x)+'" target="_blank" rel="noopener">X '+OUT+'</a>':'')+
            (p.chat?'<span class="bar2"></span><a href="'+esc(p.chat)+'" target="_blank" rel="noopener">Community '+OUT+'</a>':'')+
          '</div>'+
        '</div></div>' : '')+
    '</div>';
  }

  // ── 03 results ─────────────────────────────────────────────────
  function secResults(){
    if(!C.show_winners){
      return '<div class="sect"><div class="empty">'+
        'Results will be published once judging is complete.</div></div>';
    }

    var t=rq.trim().toLowerCase().replace(/^@/,'');
    var list=wins.filter(function(w){
      if(rtier!=='all' && w.tier!==rtier) return false;
      if(t && String(w.x_handle||'').toLowerCase().indexOf(t)<0) return false;
      return true;
    });

    /* 쪽 나누기. 거르고 난 뒤의 길이로 계산합니다 -- 등급 탭을
       누르면 목록이 줄어드는데, 그때 남은 쪽 번호를 그대로 두면
       빈 쪽에 서 있게 됩니다. */
    var pages=Math.max(1, Math.ceil(list.length/PER));
    if(rpage>pages) rpage=pages;
    if(rpage<1)     rpage=1;
    var from=(rpage-1)*PER;
    var page=list.slice(from, from+PER);

    /* 500명이면 쪽이 10장입니다. 전부 그리면 줄바꿈이 나므로
       앞뒤 두 장과 처음·끝만 두고 가운데는 … 로 접습니다. */
    var nums=[];
    (function(){
      var i, last=0;
      for(i=1;i<=pages;i++){
        if(i===1 || i===pages || Math.abs(i-rpage)<=1){
          if(last && i-last>1) nums.push(-1);
          nums.push(i); last=i;
        }
      }
    })();

    var counts={all:wins.length};
    tiers().forEach(function(x){
      counts[x.key]=wins.filter(function(w){return w.tier===x.key;}).length;
    });

    /* X 로 확인을 마쳤는가. MEMONS 로그인만으로는 모릅니다 --
       구글로 가입한 사람에게는 핸들이 없습니다. */
    var verified = !!(me && me.handle);
    var myHandle = me && me.handle ? me.handle.toLowerCase() : null;
    var myRow = myHandle ? wins.filter(function(w){
      return String(w.x_handle||'').toLowerCase()===myHandle; })[0] : null;

    /* 빈 칸은 아예 그리지 않습니다.

       핸들만 올린 캠페인에서는 순위·작품·글 주소가 전부 없습니다.
       그래도 칸을 세우면 513줄이 '—' 와 'No image' 로 뒤덮여, 뭔가
       빠진 화면처럼 보입니다. 한 명이라도 값이 있을 때만 세웁니다.

       Status 는 수상자 본인에게 카드 받는 버튼이 서는 자리이기도
       해서, 본인이면 글 주소가 없어도 세웁니다. */
    var hasRank = wins.some(function(w){ return w.rank; });
    var hasArt  = wins.some(function(w){ return w.artwork_url; });
    var hasStatus = wins.some(function(w){ return w.post_url; }) ||
                    !!(myRow && myWins.length && isCard(myRow.tier));

    return '<div class="sect">'+
      '<div class="headrow"><div>'+
        '<div class="eyebrow">Campaign results</div>'+
        '<h1 style="font-size:44px">The selected works</h1>'+
        '<div class="lede">Discover the winning creations and collect your card.</div>'+
      /* 검색창을 뺐습니다. 핸들을 가려 놓고 검색을 열어 두면, 아무
         핸들이나 쳐 넣어 당첨 여부를 하나씩 확인할 수 있습니다 --
         가린 것이 소용없어집니다. 본인 것은 로그인하면 맨 위에
         따로 나오므로 찾을 일도 없습니다. */
      '</div></div>'+

      (myRow ? '<div class="yours">'+
        '<div><div class="k">Your result</div>'+
          '<div class="rk">'+(myRow.rank?'#'+String(myRow.rank).padStart(2,'0'):'—')+'</div></div>'+
        edge(myRow.tier)+
        '<span class="who">@'+esc(myRow.x_handle)+'</span>'+
        '<span class="sp"></span>'+
        (myWins.length && isCard(myRow.tier)
          ? '<a class="cta sm" href="index.html#capsule">Issue my card '+I.arr+'</a>'
          : myWins.length
            /* 상품이 카드가 아니면 받을 곳이 없습니다. 상품이 무엇인지
               적어 주는 편이 쓸 수 없는 버튼보다 낫습니다. */
            ? '<span style="font-size:13px;color:var(--muted)">'+
                esc(tierOf(myRow.tier).prize || myRow.prize_label || '')+'</span>'
            : '<span style="font-size:12.5px;color:var(--muted)">Available after winner verification.</span>')+
      '</div>' : '')+

      (myRow ? claimHtml() : '')+

      /* 명단은 핸들을 가려 놓았습니다. 그래서 600줄을 끝까지
         내려도 자기가 됐는지 알 수가 없습니다 -- 가린 것이 맞지만,
         가려 놓았으면 대신 알려 주는 자리가 있어야 합니다.

         로그아웃: 확인하러 들어오게 합니다. 전에는 '정보 제출 받기'
         가 켜져 있을 때만 떴는데, 그건 받을 정보가 있는 캠페인에서만
         묻는다는 뜻이라 카드만 주는 캠페인에서는 아무 말도 없었습니다.

         로그인했는데 명단에 없음: 아무것도 안 그리면 '아직 안 떴나'
         하고 계속 기다립니다. 없다고 말해 주는 편이 낫습니다. */
      /* 확인을 마쳤는데 명단에 없는 경우. 어느 계정으로 확인한
         것인지 같이 적습니다 -- 핸들이 여럿인 사람은 엉뚱한 계정으로
         보고 없다고 여깁니다. */
      ((verified && !myRow)
        ? '<div class="yours" style="margin-bottom:22px">'+
            '<div><div class="k">Your result</div>'+
            '<div style="font-size:15px;margin-top:4px;color:var(--muted)">'+
              'Not on this list — checked as @'+esc(me.handle)+'.</div></div>'+
            '<span class="sp"></span>'+
            '<button class="cta sm" id="rx">'+I.x+' Check another account</button>'+
          '</div>'
        : '')+

      (verified ? '' :
        '<div class="veil">'+
          '<div class="vask"><div class="vcard">'+
            '<div class="k">Campaign results</div>'+
            '<p>Winner handles are hidden. Verify with X to see whether you are on this list.</p>'+
            '<button class="cta" id="rx">'+I.x+' Check my result</button>'+
          '</div></div>')+

      '<div class="bar vbar"><div class="tabs">'+
        [{key:'all',label:'All'}].concat(tiers()).map(function(x){
          return '<button class="tab'+(rtier===x.key?' on':'')+'" data-t="'+esc(x.key)+'">'+
            esc(x.label)+
            ' <span style="color:var(--faint)">'+(counts[x.key]||0)+'</span></button>';
        }).join('')+
      '</div><div class="sidenote" style="padding-bottom:13px">'+
        wins.length+' selected works</div></div>'+

      (list.length
        ? '<div class="tscroll"><table><thead><tr>'+
            (hasRank   ? '<th>Rank</th>'    : '')+
            (hasArt    ? '<th>Artwork</th>' : '')+
            '<th>Creator</th><th>Edition</th>'+
            (hasStatus ? '<th>Status</th>'  : '')+
          '</tr></thead><tbody>'+
          page.map(function(w){
            var isMe = myHandle && String(w.x_handle||'').toLowerCase()===myHandle;
            return '<tr'+(isMe?' class="me"':'')+'>'+
              (hasRank
                ? '<td class="rk">'+(w.rank?String(w.rank).padStart(2,'0'):'—')+'</td>' : '')+
              (hasArt
                ? '<td class="art">'+(w.artwork_url
                    ? '<img src="'+esc(w.artwork_url)+'" alt="" loading="lazy">'
                    : '<div class="none">No image</div>')+'</td>' : '')+
              /* 본인 줄만 통째로. 나머지는 가립니다. */
              '<td class="who">@'+esc(isMe ? w.x_handle : mask(w.x_handle))+'</td>'+
              '<td>'+edge(w.tier)+'</td>'+
              (hasStatus
                ? '<td>'+(isMe && myWins.length && isCard(w.tier)
                    ? '<a class="cta sm" href="index.html#capsule">Issue card '+I.arr+'</a>'
                    : w.post_url
                      ? '<a class="view" href="'+esc(w.post_url)+'" target="_blank" rel="noopener">View post '+OUT+'</a>'
                      : '<span style="color:var(--faint);font-size:13px">—</span>')+'</td>' : '')+
            '</tr>';
          }).join('')+'</tbody></table></div>'+
          (pages>1
            ? '<div class="bar vbar" style="justify-content:center;gap:8px;padding-top:18px">'+
                '<button class="tab" data-p="'+(rpage-1)+'"'+(rpage<=1?' disabled':'')+'>‹</button>'+
                nums.map(function(n){
                  return n<0
                    ? '<span style="color:var(--faint);padding:0 2px">…</span>'
                    : '<button class="tab'+(n===rpage?' on':'')+'" data-p="'+n+'">'+n+'</button>';
                }).join('')+
                '<button class="tab" data-p="'+(rpage+1)+'"'+(rpage>=pages?' disabled':'')+'>›</button>'+
                '<span class="sidenote" style="padding:0 0 0 10px">'+
                  (from+1)+'–'+Math.min(from+PER, list.length)+' / '+list.length+'</span>'+
              '</div>'
            : '')
        : '<div class="empty">'+(wins.length
            ? 'Nothing matches that search.'
            /* 아무도 없는 것과 검색에 안 걸린 것은 다른 일입니다.
               한 문장으로 뭉뚱그리면, 명단을 아직 안 올린 것을
               검색 탓으로 읽게 됩니다. */
            : 'Winners have not been announced yet.')+'</div>')+

      (verified ? '' : '</div>')+
    '</div>';
  }

  /* ── 수상자 정보 제출 (step109) ──────────────────────────────────

     구글폼을 대신합니다. 이름을 적는 칸이 없다는 점이 핵심입니다 --
     누구인지는 X 로그인이 이미 정했고, 서버는 그 줄의 임자에게만
     제출을 허락합니다. 사칭할 자리가 화면에 없습니다.

     받을 칸은 캠페인마다 다르므로 admin 에 적힌 대로 그립니다. */
  function myWin(){ return myWins.length ? myWins[0] : null; }

  /* 이 칸이 이 등급에 보이는가. 서버 contest_field_for_tier 와 같은
     판정입니다 -- 한쪽만 고치면 화면에 없는 칸을 필수로 요구하거나,
     보이는 칸이 저장되지 않습니다. */
  function fieldForTier(f, tier){
    var t=f && f.tiers;
    if(!t || !t.length) return true;
    var mine=String(tier||'').trim().toLowerCase();
    for(var i=0;i<t.length;i++){
      if(String(t[i]||'').trim().toLowerCase()===mine) return true;
    }
    return false;
  }

  /* 내 등급에 보이는 칸만. 카드 등급은 캡슐로 받으니 지갑 칸이
     필요 없고, 터보 참여상은 지갑이 있어야 합니다. */
  function myFields(){
    var w=myWin();
    if(!w) return [];
    return (C.claim_fields||[]).filter(function(f){ return fieldForTier(f, w.tier); });
  }

  function claimHtml(){
    var w=myWin();
    var all=myFields();
    var fs=all.length ? all : null;
    if(!w || !fs) return '';

    /* 닫혀 있어도, 이미 낸 사람에게는 낸 것을 보여 줍니다 -- 냈는지
       아닌지 모르는 채로 두는 쪽이 더 불안합니다. */
    if(!C.claim_open && !w.submitted) return '';

    var d=w.claim_data||{};
    var done=!!w.submitted;

    return '<div class="sect enter" id="claimbox" style="margin-top:26px">'+
      '<h3 style="font-size:clamp(24px,2.6vw,34px)">'+
        esc(C.claim_title||'Claim your prize')+'</h3>'+
      (C.claim_body?'<div class="sub">'+esc(C.claim_body)+'</div>'
                   :'<div class="sub">Tell us where to send it.</div>')+

      (done?'<div class="msg ok" style="margin:0 0 20px">'+
        'Submitted. You can change it while the campaign is open.</div>':'')+

      fs.map(function(f){
        var v=d[f.key]==null?'':String(d[f.key]);
        return '<div class="fld"><div class="k">'+esc(f.label)+
            (f.required?' *':'')+'</div>'+
          '<input class="inp" id="cf_'+esc(f.key)+'" value="'+esc(v)+'" '+
            'placeholder="'+esc(f.hint||'')+'" autocomplete="off" spellcheck="false"'+
            (C.claim_open?'':' disabled')+'></div>';
      }).join('')+

      (C.claim_open
        ? '<button class="cta" id="csub">'+(done?'Update':'Submit')+'</button>'
        : '<button class="cta" disabled>Submissions are closed</button>')+

      '<div class="note">Only @'+esc(w.x_handle||(me&&me.handle)||'')+
        ' can submit this. Nobody else can see or change it.</div>'+
      '<div class="msg" id="cmsg"></div>'+
    '</div>';
  }

  /* 서버가 'MISSING:BingX UID' 처럼 칸 이름을 달아 보냅니다. */
  function claimError(code){
    var i=String(code||'').indexOf(':');
    var head=i<0?String(code||''):code.slice(0,i);
    var who =i<0?'':code.slice(i+1);
    var say1={
      MISSING     : who+' is required.',
      BAD_WALLET  : who+' must look like 0x followed by 40 characters.',
      NOT_A_WALLET: who+' is a MEMONS account number, not a wallet you can withdraw from.',
      BAD_EMAIL   : who+' does not look like an email address.',
      BAD_NUMBER  : who+' must be digits only.',
      TOO_LONG    : who+' is too long.',
      NOT_YOURS   : 'This prize is not on your account.',
      CLAIM_CLOSED: 'Submissions are closed for this campaign.',
      NO_FORM     : 'Nothing to submit yet.',
      NO_FIELDS_FOR_TIER : 'There is nothing to submit for this prize.',
      /* 빠져 있던 둘. 서버는 보내고 있었는데 화면이 알아듣지 못해
         "다시 시도" 로만 뭉개고 있었습니다. */
      BAD_ID      : 'Could not tell which prize this is. Please reload the page.',
      BAD_DATA    : 'Could not read what was entered. Please reload the page.',
      CLAIM_FAILED: 'Something went wrong on our side. Please try again shortly.',
      NETWORK     : 'Could not reach the server. Please try again.'
    }[head];
    /* 모르는 코드면 그 코드를 그대로 붙입니다. "다시 시도하세요" 만
       보여 주면, 수상자도 우리도 무엇이 막았는지 알 수가 없습니다 --
       500명한테서 같은 문의가 오면 답할 말이 없습니다. */
    return say1 || ('Could not save that. (' + (code || 'unknown') + ')');
  }

  function submitClaim(){
    var w=myWin(), fs=myFields();
    if(!w) return;
    var b=document.getElementById('csub');
    var out={};
    fs.forEach(function(f){
      var el=document.getElementById('cf_'+f.key);
      out[f.key]=el?(el.value||'').trim():'';
    });

    b.disabled=true; b.textContent='Saving…'; say('cmsg','','');
    game({contest:'claim', id:w.id, data:out}).then(function(r){
      if(r.ok){
        /* 낸 값을 곧바로 손에 든 것에도 반영합니다 -- 다시 그릴 때
           칸이 비어 보이면 저장이 안 된 것처럼 읽힙니다. */
        w.claim_data=r.data.claim||out; w.submitted=true;
        renderDetail();
        say('cmsg','ok','Saved. We will use this to send your prize.');
        return;
      }
      b.disabled=false; b.textContent = w.submitted?'Update':'Submit';
      say('cmsg','bad', claimError(r.code));
    });
  }

  // ── detail render + wiring ─────────────────────────────────────
  function renderDetail(){
    /* 한 장에 이어 붙입니다: 머리글 → 소개 → 결과.
       발표 전이면 secResults 가 "아직 발표 전" 한 줄만 그립니다. */
    wrap.innerHTML = heroHtml() + secAbout() + secResults();

    ['rx'].forEach(function(id){
      var cx=document.getElementById(id);
      if(!cx) return;
      var was=cx.innerHTML;
      cx.onclick=function(){
      cx.disabled=true; cx.textContent='…';
      /* try 로 감싸는 이유: x-auth.js 가 안 올라가 있으면 MEMONS_X 가
         없어서 아래 한 줄이 그 자리에서 터집니다. 그러면 .catch 는
         붙지도 못하고, 버튼은 '…' 인 채로 영영 멈춥니다 -- 쓰는
         사람에게는 아무 말도 없이 죽은 버튼으로만 보입니다. */
      function fail(e){
        cx.disabled=false; cx.innerHTML=was;
        /* 결과 화면에는 #emsg 가 없습니다. 그쪽에서는 버튼 옆에
           바로 적습니다 -- 아무 말 없이 되돌아가면 눌리지 않은
           것처럼 보입니다. */
        var msg=(e && e.message) ? e.message : String(e);
        if(document.getElementById('emsg')) say('emsg','bad', msg);
        else {
          var p=document.createElement('div');
          p.className='msg bad'; p.style.cssText='flex-basis:100%;margin-top:8px';
          p.textContent=msg;
          if(!cx.parentNode.querySelector('.msg')) cx.parentNode.appendChild(p);
        }
      }
      try{
        if(!window.MEMONS_X) throw new Error('X sign-in is unavailable on this page. (x-auth.js did not load)');
        MEMONS_X.signIn({ returnTo: location.pathname+location.hash }).catch(fail);
      }catch(e){ fail(e); }
      };
    });

    var csub=document.getElementById('csub');
    if(csub) csub.onclick=submitClaim;

    wrap.querySelectorAll('[data-t]').forEach(function(b){
      b.onclick=function(){ rtier=b.dataset.t; rpage=1; renderDetail(); };
    });
    wrap.querySelectorAll('[data-p]').forEach(function(b){
      b.onclick=function(){
        if(b.disabled) return;
        rpage=+b.dataset.p; renderDetail();
        var t=document.querySelector('.sect table');
        if(t) t.scrollIntoView({block:'start'});
      };
    });
  }

  function say(id, cls, text){
    var m=document.getElementById(id); if(!m) return;
    m.className='msg '+cls; m.textContent=text;
  }


  // ── load ───────────────────────────────────────────────────────
  function currentKey(){
    var m=/^#c=(.+)$/.exec(location.hash||'');
    if(m){ try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } }
    return new URLSearchParams(location.search).get('c') || '';
  }

  function whoAmI(){
    if(!tok()) return Promise.resolve(null);
    return fetch(API+'/social/me',{headers:{Authorization:'Bearer '+tok()}})
      .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  }

  /* /social/me 는 이메일만 알려주고 핸들은 모릅니다. 핸들은 X 로
     들어왔는지를 가르는 값이라 따로 묻습니다. */
  function myHandle(){
    if(!tok()) return Promise.resolve(null);
    return game({contest:'whoami'}).then(function(r){
      return (r.ok && r.data.handle) ? {handle:r.data.handle} : null;
    });
  }

  function loadDetail(key){
    wrap.innerHTML='<div class="spin"></div>';

    Promise.all([
      rpc('contest_one',{p_event:key}),
      rpc('contest_public_winners',{p_event:key}),
      myHandle(),
      tok() ? game({contest:'mine'}) : Promise.resolve({ok:false})
    ]).then(function(res){
      C    = (res[0].ok && res[0].data) ? res[0].data : null;
      wins = (res[1].ok && Array.isArray(res[1].data)) ? res[1].data : [];
      me   = res[2];
      myWins = (res[3].ok && res[3].data.wins)
                 ? res[3].data.wins.filter(function(w){ return w.event_key===key; }) : [];

      if(!C){
        wrap.innerHTML='<div class="crumb"><a href="#">← Campaigns</a></div>'+
          '<div class="empty">This campaign is not available.</div>';
        return;
      }

      renderDetail();
      /* 토큰이 살아 있는지는 여기서야 확실해집니다. 처음 그릴 때의
         SIGN IN 을 로그인한 사람에게 그대로 두지 않습니다. */
      syncHeader();
    });
  }

  /* 머리글의 SIGN IN.

     다른 페이지와 같은 일을 해야 합니다 -- 전에는 홈으로 가는 링크라
     눌러도 로그인 창이 안 열렸습니다. social-login.js 가 띄우는
     공통 창을 씁니다. 로그인한 뒤에는 My Page 로 바뀝니다. */
  function syncHeader(){
    var b=document.getElementById('hdrAuth'),
        t=document.getElementById('hdrAuthText');
    if(!b||!t) return;
    if(tok()){
      t.textContent='MY PAGE';
      b.onclick=function(){ location.href='mypage-dashboard.html'; };
    }else{
      t.textContent='SIGN IN';
      b.onclick=function(){
        if(window.MEMONS_SIGNIN) window.MEMONS_SIGNIN();
        else location.href='index.html';   /* 공통 창이 없으면 홈으로 */
      };
    }
  }
  syncHeader();

  // ── start ──────────────────────────────────────────────────────
  var x=new URLSearchParams(location.search).get('x');
  if(x) history.replaceState(null,'',location.pathname+(location.hash||''));

  function route(){
    var key=currentKey();
    rpage=1; rtier='all'; rq='';
    if(!key){ C=null; loadList(); return; }
    loadDetail(key);
  }

  window.addEventListener('hashchange', function(){ window.scrollTo(0,0); route(); });
  route();
})();
</script>
</body>
</html>
